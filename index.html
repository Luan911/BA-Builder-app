<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BA Builder</title>
  <meta name="description" content="A complete workspace for Technical Business Analysts: strategy, elicitation, requirements, modelling, diagrams and documentation." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230f766e'/%3E%3Cpath d='M7 7h6a3 3 0 0 1 0 6H7zM7 13h7a3 3 0 0 1 0 6H7z' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/app.css" />
  <script>
    try {
      var t = (JSON.parse(localStorage.getItem('bab.settings') || '{}').theme) || 'auto';
      var d = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = d ? 'dark' : 'light';
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"><noscript>BA Builder needs JavaScript.</noscript></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
