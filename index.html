<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BA Builder</title>
  <meta name="description" content="A complete workspace for Technical Business Analysts: strategy, elicitation, requirements, modelling, diagrams and documentation." />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <script>
    // Record unexpected errors from the very first moment (shown to the user by js/app.js, read by tests/e2e.html).
    window.__babErrors = [];
    addEventListener('error', function (e) { window.__babErrors.push(String((e.error && e.error.stack) || e.message)); });
    addEventListener('unhandledrejection', function (e) { window.__babErrors.push(String((e.reason && (e.reason.stack || e.reason.message)) || e.reason)); });
  </script>
  <link rel="stylesheet" href="css/app.css" />
  <meta name="theme-color" content="#000000" />
</head>
<body>
  <div id="app"><noscript>BA Builder needs JavaScript.</noscript></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
